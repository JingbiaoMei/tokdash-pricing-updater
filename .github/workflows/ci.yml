name: CI

on:
  push:
    branches:
      - main
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Checkout
        # Pinned by commit, matching the convention in the tokdash repo.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install httpx pyyaml pytest

      - name: Test
        run: python -m pytest -q --junitxml=smoke.xml

      - name: Fail on a silent skip
        # A clean clone used to skip ten tests because their fixture lived in
        # gitignored output/. A green run that asserts nothing is worse than red.
        run: |
          python - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse("smoke.xml").getroot()
          cases = root.iter("testcase")
          skipped = [tc.get("classname") + "." + tc.get("name") for tc in cases
                     if tc.find("skipped") is not None]
          if skipped:
              print("::error::tests skipped, the suite is not asserting what it claims")
              for name in skipped:
                  print("  skipped:", name)
              sys.exit(1)
          print("no skips")
          PY

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-${{ matrix.python-version }}
          path: smoke.xml
          retention-days: 14

# Maps OpenRouter model IDs to official pricing families.
#
# When a model's canonical_id is not found directly in official_prices.yaml,
# the overlay checks this map for a family match.  Entries are tried in order:
# first exact match on official_prices, then pattern match here.
#
# Format:
#   - pattern: "prefix-*"       → prefix glob
#   - family:  "deepseek-chat"  → key into official_prices.yaml

families:
  # Historical chat/v3 and R1 variants use the configured pricing families.
  # Current DeepSeek model IDs and explicitly listed aliases match live prices
  # directly; do not map every historical variant to today's Flash/Pro tariff.
  - pattern: "deepseek-chat-*"
    family: deepseek-chat
  - pattern: "deepseek-v3*"
    family: deepseek-chat
  - pattern: "deepseek-r1-*"
    family: deepseek-r1

  # Anthropic: sonnet 3.7 variants → sonnet 4 family pricing (same rates)
  - pattern: "claude-3.7-sonnet*"
    family: claude-sonnet-4

  # GLM: exacto variants inherit base model pricing
  - pattern: "glm-4.6:*"
    family: glm-4.6

  # Kimi: exacto variants inherit base model pricing
  - pattern: "kimi-k2-0905:*"
    family: kimi-k2-0905

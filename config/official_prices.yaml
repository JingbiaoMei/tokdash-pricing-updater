# Official prices from provider websites / API docs.
# Manually maintained. These are the authoritative first-party prices.
#
# When both OpenRouter and official prices exist for a model, the updater
# normalizes to USD (using config/fx_rates.yaml), then applies
# max(openrouter, official) per field — conservative for cost tracking.
#
# All prices are per 1M tokens in the currency specified.
# Fields: input, output, cache_read, cache_write, currency
# Omit a field to fall back to OpenRouter's value for that field.
# Currency defaults to USD if omitted.
#
# Versioned variants inherit via config/official_family_map.yaml.
# Source URLs are required for auditability.


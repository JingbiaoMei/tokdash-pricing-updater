# Pricing policy for the tokdash pricing DB generator.

# OpenRouter pricing field mapping (OpenRouter field → tokdash field).
field_mapping:
  prompt: input
  completion: output
  input_cache_read: cache_read
  input_cache_write: cache_write

# Fallback heuristics when a source does not provide cache pricing.
# factor is multiplied by the input rate.
cache_fallback:
  openai:
    cache_read_factor: 0.50
    cache_write_factor: 1.00
  anthropic:
    cache_read_factor: 0.10
    cache_write_factor: 1.25
  google:
    cache_read_factor: 0.25
    cache_write_factor: 1.00
  deepseek:
    cache_read_factor: 0.10
    cache_write_factor: 1.00
  default:
    cache_read_factor: 0.10
    cache_write_factor: 1.00

# Rounding: max decimal places for per-MTok prices.
rounding:
  max_decimal_places: 6

# Context tier: when a provider offers multiple context-length tiers
# (e.g. Anthropic <=200K vs >200K), pick this one as the default
# and mention alternatives in the note field.
context_tier_preference: standard  # "standard" = lowest / default tier

# Removal gating.
#   enabled: false  -> never flag stale/legacy models at all. pricing_db.json is
#                      a runtime compatibility layer; removing a key zeroes out
#                      cost for any historical session that used that model, so
#                      we keep every legacy key. With deletions never wanted,
#                      stale detection only produces noise, so it is turned off.
#   min_consecutive_misses -> if re-enabled, how many consecutive scrape misses
#                      before a model is even proposed for deletion (and
#                      deletions are always manual_only, never automatic).
removal:
  enabled: false
  min_consecutive_misses: 4

# Provider-specific section comment keys for rendering.
# Determines ordering in the final pricing_db.json.

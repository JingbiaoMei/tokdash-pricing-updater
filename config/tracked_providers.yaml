# OpenRouter provider slugs to track.
# Only models from these providers are scraped.
# Providers deliberately NOT tracked (and why): see config/untracked_providers.md
providers:
  - slug: openai
    tokdash_provider: openai
  - slug: anthropic
    tokdash_provider: anthropic
  - slug: google
    tokdash_provider: google
  - slug: moonshotai
    tokdash_provider: moonshotai
  - slug: minimax
    tokdash_provider: minimax
  - slug: z-ai
    tokdash_provider: z-ai
  - slug: deepseek
    tokdash_provider: deepseek
  - slug: xiaomi
    tokdash_provider: xiaomi
  - slug: qwen
    tokdash_provider: qwen
  - slug: bytedance
    tokdash_provider: bytedance
  - slug: bytedance-seed
    tokdash_provider: bytedance
  - slug: meituan
    tokdash_provider: meituan
  - slug: tencent
    tokdash_provider: tencent
  - slug: x-ai
    tokdash_provider: xai
  - slug: stepfun
    tokdash_provider: stepfun
  - slug: baidu
    tokdash_provider: baidu
  - slug: mistralai
    tokdash_provider: mistral
  - slug: cohere
    tokdash_provider: cohere
  - slug: perplexity
    tokdash_provider: perplexity
  - slug: ai21
    tokdash_provider: ai21
  - slug: rekaai          # NB: OpenRouter author slug is "rekaai", not "reka"
    tokdash_provider: reka
  - slug: meta-llama
    tokdash_provider: meta
  - slug: meta
    tokdash_provider: meta
  - slug: nvidia
    tokdash_provider: nvidia
  - slug: microsoft
    tokdash_provider: microsoft
  - slug: amazon
    tokdash_provider: amazon

# OpenRouter model ID patterns to skip even if provider matches.
skip_patterns:
  - ":free$"
  - ":beta$"
  - ":extended$"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tokdash-pricing-updater"
version = "0.1.0"
description = "Layered pricing DB generator for tokdash"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "httpx>=0.27",
  "pyyaml>=6.0",
]

[project.scripts]
pricing-updater = "pricing_updater.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
